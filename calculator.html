<!DOCTYPE html>
<html>
  <head>
   <link rel="stylesheet" href="calculator.css"> 
  <title>calculator</title>
  </head>

  <body>
    <div id="calculator">
      <input type="text" id="display" readonly>
      <div class="button_container">

      <button class="cal_button" onclick="currentDisplay=' ';  document.querySelector('#display').value=currentDisplay;">C</button>

      <button class="cal_button" onclick="currentDisplay+=1 ;  document.querySelector('#display').value=currentDisplay;">1</button>

      <button class="cal_button" onclick="currentDisplay+=2 ;  document.querySelector('#display').value=currentDisplay;">2</button><br>

      <button class="cal_button" onclick="currentDisplay=currentDisplay +'+';  document.querySelector('#display').value=currentDisplay;">+</button>

      <button class="cal_button" onclick="currentDisplay+=3 ;  document.querySelector('#display').value=currentDisplay;">3</button>

      <button class="cal_button"  onclick="currentDisplay+=4 ;  document.querySelector('#display').value=currentDisplay;">4</button><br>

      <button class="cal_button" onclick="currentDisplay=currentDisplay+'-';  document.querySelector('#display').value=currentDisplay;">-</button>

      <button class="cal_button" onclick="currentDisplay+=5 ;  document.querySelector('#display').value=currentDisplay;">5</button>

      <button class="cal_button" onclick="currentDisplay+=6;  document.querySelector('#display').value=currentDisplay;">6</button><br>

      <button class="cal_button" onclick="currentDisplay=currentDisplay+'*';  document.querySelector('#display').value=currentDisplay;">*</button>

      <button class="cal_button" onclick="currentDisplay+=7;  document.querySelector('#display').value=currentDisplay;">7</button>

      <button class="cal_button" onclick="currentDisplay+=8;  document.querySelector('#display').value=currentDisplay;">8</button><br>

      <button class="cal_button" onclick="currentDisplay=currentDisplay+'/';  document.querySelector('#display').value=currentDisplay;">/</button>

      <button class="cal_button" onclick="
      currentDisplay=eval(currentDisplay);  document.querySelector('#display').value=currentDisplay;">=</button>

      <button class="cal_button" onclick="currentDisplay+=9;  document.querySelector('#display').value=currentDisplay;">9</button><br>

      <button class="cal_button" onclick="currentDisplay;  document.querySelector('#display').value=currentDisplay;">0</button>

      <button class="cal_button" onclick="currentDisplay=currentDisplay+'.';  document.querySelector('#display').value=currentDisplay;">.</button>

      </div>
    </div>
    <script>
      let currentDisplay='0';
      document.querySelector('#display').value=currentDisplay;
    </script>
  </body>
</html>
